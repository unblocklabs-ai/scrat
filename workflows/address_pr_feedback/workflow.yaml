name: address_pr_feedback
description: Address review comments or requested changes on a bot pull request and push verified updates.
enabled: true
mode: change
priority: 60
on:
  event:
    source: github_items
    kind: pr_feedback
    item: pr
    author: bot
defaults:
  provider: codex-lb
  model: gpt-6.2-sol
  thinkingLevel: high
  tools: [read, grep, find, ls, bash, edit, write]
permissions:
  github: [read, comment, push]
  workspace: [read, write]
